    <script>
        /* Interactive Snowfall Engine */
        (function initSnowEngine() {
            const canvas = document.getElementById('snow-canvas');
            const ctx = canvas.getContext('2d');
            let width = (canvas.width = window.innerWidth);
            let height = (canvas.height = window.innerHeight);

            window.addEventListener('resize', () => {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            });

            let mouseX = -1000, mouseY = -1000;
            window.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; });
            window.addEventListener('mouseleave', () => { mouseX = -1000; mouseY = -1000; });
            window.addEventListener('touchmove', (e) => {
                if (e.touches.length > 0) { mouseX = e.touches[0].clientX; mouseY = e.touches[0].clientY; }
            }, { passive: true });

            const particleCount = Math.floor(Math.min(width, 1600) / 48);
            const snowflakes = [];

            class Snowflake {
                constructor() { this.reset(true); }
                reset(initial = false) {
                    this.x = Math.random() * width;
                    this.y = initial ? Math.random() * height : -60;
                    this.radius = Math.random() * 12 + 10.5;
                    this.speedY = Math.random() * 1.6 + 1.2;
                    this.speedX = Math.random() * 0.4 - 0.2;
                    this.opacity = Math.random() * 0.45 + 0.45;
                    this.swingSpeed = Math.random() * 0.025 + 0.01;
                    this.swingAngle = Math.random() * Math.PI * 2;
                    this.swingWidth = Math.random() * 1.2 + 0.5;
                    this.rotation = Math.random() * Math.PI * 2;
                    this.rotationSpeed = (Math.random() - 0.5) * 0.02;
                    this.designPattern = Math.floor(Math.random() * 3);
                }
                update() {
                    this.swingAngle += this.swingSpeed;
                    this.rotation += this.rotationSpeed;
                    this.x += this.speedX + Math.sin(this.swingAngle) * this.swingWidth;
                    this.y += this.speedY;

                    const dx = this.x - mouseX, dy = this.y - mouseY;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const maxDist = 180;
                    if (dist < maxDist) {
                        const force = (maxDist - dist) / maxDist;
                        this.x += (dx / (dist || 1)) * force * 4.5;
                        this.y += (dy / (dist || 1)) * force * 3.0;
                    }
                    if (this.y > height + 60 || this.x < -60 || this.x > width + 60) this.reset();
                }
                draw() {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.rotation);
                    ctx.strokeStyle = `rgba(255, 255, 255, ${this.opacity})`;
                    ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                    ctx.lineWidth = 1.8; ctx.lineCap = 'round';
                    ctx.shadowBlur = 10; ctx.shadowColor = 'rgba(255, 255, 255, 0.9)';
                    const r = this.radius;
                    for (let i = 0; i < 6; i++) {
                        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(r, 0); ctx.stroke();
                        const b1 = r * 0.45, bLen1 = r * 0.3;
                        ctx.beginPath(); ctx.moveTo(b1, 0); ctx.lineTo(b1 + bLen1 * 0.4, -bLen1);
                        ctx.moveTo(b1, 0); ctx.lineTo(b1 + bLen1 * 0.4, bLen1); ctx.stroke();
                        if (this.designPattern >= 1) {
                            const b2 = r * 0.75, bLen2 = r * 0.22;
                            ctx.beginPath(); ctx.moveTo(b2, 0); ctx.lineTo(b2 + bLen2 * 0.4, -bLen2);
                            ctx.moveTo(b2, 0); ctx.lineTo(b2 + bLen2 * 0.4, bLen2); ctx.stroke();
                        }
                        ctx.rotate(Math.PI / 3);
                    }
                    if (this.designPattern === 2) {
                        ctx.beginPath(); ctx.arc(0, 0, r * 0.22, 0, Math.PI * 2); ctx.fill();
                    }
                    ctx.restore();
                }
            }

            for (let i = 0; i < particleCount; i++) snowflakes.push(new Snowflake());

            function animate() {
                ctx.clearRect(0, 0, width, height);
                for (let i = 0; i < snowflakes.length; i++) {
                    snowflakes[i].update(); snowflakes[i].draw();
                }
                requestAnimationFrame(animate);
            }
            animate();
        })();

                { url: "ねむりねむさん3.jpg", text: "ねむりねむさん" , position: "top center" },
                { url: "桐谷ネオンさん.jpg", text: "桐谷ネオンさん", position: "top center" },
                { url: "水月羽ねあさん.jpg", text: "水月羽ねあさん" },
                { url: "モガモさん.jpg", text: "モガモさん" },
                { url: "魔中ユノさん.jpg", text: "魔中ユノさん" , position: "top center" },
                { url: "もちあずきさん2.jpg", text: "もちあずきさん" }
            ];

            // シャッフル
            for (let i = galleryItems.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [galleryItems[i], galleryItems[j]] = [galleryItems[j], galleryItems[i]];
            }

            const imageElements = document.querySelectorAll('.random-gallery-img');
            const captionElements = document.querySelectorAll('.frame-caption');

            imageElements.forEach((img, index) => {
                if (galleryItems[index]) {
                    img.src = galleryItems[index].url;
                    
                    if (galleryItems[index].position) {
                        img.style.objectPosition = galleryItems[index].position;
                    } else {
                        img.style.objectPosition = "center";
                    }

                    if (captionElements[index]) {
                        captionElements[index].textContent = galleryItems[index].text;
                    }
                }
            });

            const glowStyles = [
                { shadow: '0 20px 45px -15px rgba(125, 211, 252, 0.45), 0 0 30px 2px rgba(255, 255, 255, 0.95), inset 0 0 20px rgba(255, 255, 255, 0.8)', textColor: '#38bdf8' },
                { shadow: '0 20px 45px -15px rgba(167, 243, 208, 0.45), 0 0 30px 2px rgba(255, 255, 255, 0.95), inset 0 0 20px rgba(207, 250, 254, 0.8)', textColor: '#34d399' },
                { shadow: '0 20px 45px -15px rgba(221, 214, 254, 0.45), 0 0 30px 2px rgba(255, 255, 255, 0.95), inset 0 0 20px rgba(243, 232, 255, 0.8)', textColor: '#a78bfa' },
                { shadow: '0 20px 45px -15px rgba(165, 243, 252, 0.5), 0 0 30px 2px rgba(255, 255, 255, 0.95), inset 0 0 20px rgba(224, 242, 254, 0.8)', textColor: '#22d3ee' },
                { shadow: '0 20px 45px -15px rgba(191, 219, 254, 0.45), 0 0 30px 2px rgba(255, 255, 255, 0.95), inset 0 0 20px rgba(238, 242, 254, 0.8)', textColor: '#60a5fa' }
            ];

            const cards = document.querySelectorAll('.gallery-card');
            cards.forEach(card => {
                const parent = card.closest('.scroll-reveal');
                const caption = parent ? parent.querySelector('.frame-caption') : null;

                const randomizeGlow = () => {
                    const randomTheme = glowStyles[Math.floor(Math.random() * glowStyles.length)];
                    card.style.boxShadow = randomTheme.shadow;
                    if (caption) {
                        caption.style.color = randomTheme.textColor;
                        caption.style.letterSpacing = '0.45em';
                        setTimeout(() => { caption.style.letterSpacing = '0.35em'; }, 400);
                    }
                    card.classList.remove('animate-ice-pulse');
                    void card.offsetWidth;
                    card.classList.add('animate-ice-pulse');
                };
                randomizeGlow();
                card.addEventListener('click', randomizeGlow);
            });

            const observer = new IntersectionObserver((entries, obs) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const target = entry.target;
                        setTimeout(() => { target.classList.add('is-visible'); }, parseInt(target.getAttribute('data-delay') || '0', 10));
                        obs.unobserve(target);
                    }
                });
            }, { root: null, rootMargin: '0px 0px -60px 0px', threshold: 0.1 });

            document.querySelectorAll('.scroll-reveal').forEach(el => observer.observe(el));
        });
    </script>
</body>
</html>
